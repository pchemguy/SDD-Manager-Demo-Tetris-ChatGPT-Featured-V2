<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Owned lifecycle test harness</title></head><body>
<button id="remount">Mount fresh</button><button id="retained">Mount retained</button><button id="unmount">Unmount</button><output id="frames"></output><main id="harness"></main>
<script type="module">
import {createConfiguration} from '/src/application/configuration.ts';
import {mountGame} from '/src/platform/browser/main.ts';
const request=window.requestAnimationFrame.bind(window),cancel=window.cancelAnimationFrame.bind(window),pending=new Set();
window.requestAnimationFrame=callback=>{const id=request(time=>{pending.delete(id);callback(time)});pending.add(id);return id};
window.cancelAnimationFrame=id=>{pending.delete(id);cancel(id)};
const configuration=createConfiguration();
let dispose=()=>{};
document.querySelector('#retained').onclick=()=>{dispose();dispose=mountGame(document.querySelector('#harness'),()=>0.5,configuration)};
document.querySelector('#remount').onclick=()=>{dispose();dispose=mountGame(document.querySelector('#harness'),()=>0.5)};
document.querySelector('#unmount').onclick=()=>{dispose();dispose();document.querySelector('#frames').textContent=String(pending.size)};
</script></body></html>
